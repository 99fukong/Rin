name: Deploy

on:
  push:
    branches:
      - dev
      - main
      - fix/*
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 安装 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3️⃣ 安装 Bun
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-          

      # 4️⃣ 调试当前路径
      - name: Debug working directory
        run: |
          echo "Current directory:"
          pwd
          echo "Files in root:"
          ls -al

      - name: Install dependencies (monorepo)
        run: bun install --workspaces

      # 验证依赖安装情况
      - name: Verify node_modules structure
        run: |
          echo "=== Root node_modules ==="
          ls -1 node_modules 2>/dev/null || echo "✅ root 没有 node_modules"
          echo "=== client node_modules ==="
          ls -1 client/node_modules | head -20 || echo "❌ client node_modules 未找到"
          echo "=== Server node_modules ==="
          ls -1 server/node_modules | head -20 || echo "❌ server node_modules 未找到"

      # 7️⃣ 测试 strip-indent 是否能正确解析
      - name: Verify strip-indent resolution
        run: |
          echo "Server resolve test:"
          bun --cwd server -e "console.log(import.meta.resolve('strip-indent'))"
          bun  -e "console.log(import.meta.resolve('strip-indent'))"

      # 8️⃣ 部署到 Cloudflare
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RIN_GITHUB_CLIENT_ID: ${{ secrets.RIN_GITHUB_CLIENT_ID }}
          RIN_GITHUB_CLIENT_SECRET: ${{ secrets.RIN_GITHUB_CLIENT_SECRET }}
          DB_NAME: ${{ vars.DB_NAME }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          S3_ACCESS_HOST: ${{ vars.S3_ACCESS_HOST }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_CACHE_FOLDER: ${{ vars.S3_CACHE_FOLDER }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_FOLDER: ${{ vars.S3_FOLDER }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          RSS_TITLE: ${{ vars.RSS_TITLE }}
          RSS_DESCRIPTION: ${{ vars.RSS_DESCRIPTION }}
        run: |
          echo "🏗️ Running migrator..."
          bun --cwd server -e "console.log(import.meta.resolve('strip-indent'))"
          bun run  --cwd server  ./../scripts/migrator.ts
